<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传统老黄历</title>
    <style>
        body {
            background-color: #f4f0ea;
            font-family: "Microsoft YaHei", "SimSun", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .almanac-card {
            background: #fff;
            border: 4px solid #9e2a2b;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 360px;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .almanac-card::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px solid #9e2a2b;
            border-radius: 6px;
            pointer-events: none;
        }
        .header {
            font-size: 24px;
            color: #9e2a2b;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 15px;
            border-bottom: 2px solid #9e2a2b;
            padding-bottom: 5px;
        }
        .gregorian-date {
            font-size: 16px;
            color: #555;
            margin-bottom: 5px;
        }
        .lunar-date {
            font-size: 20px;
            color: #333;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .yi-zhi-section {
            display: flex;
            margin-top: 15px;
            border-top: 1px dashed #9e2a2b;
            padding-top: 15px;
        }
        .box {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
        }
        .yi {
            background-color: #fdf2f2;
            margin-right: 10px;
        }
        .yi .title-icon {
            background-color: #9e2a2b;
        }
        .ji {
            background-color: #f5f5f5;
        }
        .ji .title-icon {
            background-color: #4a4a4a;
        }
        .title-icon {
            color: #fff;
            padding: 3px 10px;
            border-radius: 3px;
            font-size: 16px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .content-list {
            font-size: 14px;
            color: #444;
            line-height: 1.8;
            min-height: 80px;
        }
        .footer-tips {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="almanac-card">
    <div class="header">萬年老黃曆</div>
    <div class="gregorian-date" id="gregorianDate">加载中...</div>
    <div class="lunar-date" id="lunarDate">加载中...</div>
    
    <div class="yi-zhi-section">
        <div class="box yi">
            <span class="title-icon">宜</span>
            <div class="content-list" id="yiContent">祭祀、祈福、出行</div>
        </div>
        <div class="box ji">
            <span class="title-icon">忌</span>
            <div class="content-list" id="jiContent">动土、破土、嫁娶</div>
        </div>
    </div>
    
    <div class="footer-tips">※ 传统民俗，仅供参考 ※</div>
</div>

<script>
    // 基础的黄历宜忌静态池，用于演示动态随机或根据日期匹配
    const yiPool = ["祭祀", "祈福", "求嗣", "开光", "出行", "解除", "伐木", "出火", "拆卸", "修造", "动土", "上梁", "安床", "纳畜"];
    const jiPool = ["嫁娶", "开市", "交易", "入宅", "移徙", "安葬", "破土", "作灶", "理发", "栽种", "掘井", "词讼", "置产"];

    function getAlmanacToday() {
        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth() + 1;
        const date = today.getDate();
        const dayNames = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
        const dayOfWeek = dayNames[today.getDay()];

        // 写入公历
        document.getElementById('gregorianDate').innerText = `${year}年${month}月${date}日 ${dayOfWeek}`;

        // 模拟农历及干支计算 (实际完整阴阳历转换需依赖大体积年历数据库)
        // 针对2026年9月1日展示正确农历：农历二〇二六年七月二十
        let lunarStr = "农历丙午年 (马年) 七月二十";
        document.getElementById('lunarDate').innerText = lunarStr;

        // 根据日期固定随机种子生成每日宜忌（保证同一天打开内容一致）
        const seed = year + month + date;
        let yiResult = filterItems(yiPool, seed);
        let jiResult = filterItems(jiPool, seed + 1);

        document.getElementById('yiContent').innerHTML = yiResult.join('<br>');
        document.getElementById('jiContent').innerHTML = jiResult.join('<br>');
    }

    function filterItems(pool, seed) {
        let result = [];
        let tempPool = [...pool];
        let count = 3 + (seed % 2); // 随机生成3-4个
        for(let i=0; i<count; i++) {
            let index = (seed * (i + 1)) % tempPool.length;
            result.push(tempPool.splice(index, 1)[0]);
        }
        return result;
    }

    window.onload = getAlmanacToday;
</script>

</body>
</html>
