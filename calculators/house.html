<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malaysia House Purchase Cost Calculator</title>
  <style>
    body {
      background-color: #0f172a;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    nav {
      background-color: #111827;
      text-align: center;
      padding: 12px 0;
    }
    nav a {
      background-color: #22c55e;
      color: #072b13;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
    }
    header {
      text-align: center;
      padding: 20px;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px 40px 16px;
    }
    .card {
      background-color: #111827;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 12px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 6px 0 12px 0;
      border-radius: 8px;
      border: 1px solid #1f2937;
      background-color: #0b1220;
      color: #e5e7eb;
    }
    button {
      background-color: #22c55e;
      color: #072b13;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed #1f2937;
    }
    .total {
      font-weight: bold;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- Back to Home button -->
  <nav>
    <a href="index.html">🏠 Back to Home</a>
  </nav>

  <header>
    <h1>Malaysia House Purchase Cost Calculator</h1>
    <p>Enter property price to estimate costs</p>
  </header>

  <main>
    <section class="card">
      <h2>Inputs</h2>
      <label for="price">Property price (RM)</label>
      <input type="number" id="price" placeholder="e.g., 650000">
      
      <label for="down">Down Payment (%)</label>
      <input type="number" id="down" value="10">
      
      <button id="calc">Calculate</button>
    </section>

    <section class="card">
      <h2>Results</h2>
      <div class="result-row">
        <span>Down Payment:</span> <span id="downOut">RM 0</span>
      </div>
      <div class="result-row">
        <span>Loan Amount:</span> <span id="loanOut">RM 0</span>
      </div>
      <div class="result-row total">
        <span>Total Upfront Cash:</span> <span id="totalOut">RM 0</span>
      </div>
    </section>
  </main>

  <script>
    const priceEl = document.getElementById('price');
    const downEl = document.getElementById('down');
    const downOut = document.getElementById('downOut');
    const loanOut = document.getElementById('loanOut');
    const totalOut = document.getElementById('totalOut');

    function fmtRM(num) {
      return 'RM ' + num.toLocaleString('en-MY', {maximumFractionDigits:0});
    }

    document.getElementById('calc').addEventListener('click', () => {
      const price = Number(priceEl.value) || 0;
      const downPct = Number(downEl.value) || 0;
      const downPayment = Math.round(price * downPct / 100);
      const loan = price - downPayment;
      const total = downPayment; // For simplicity, just down payment as upfront

      downOut.textContent = fmtRM(downPayment);
      loanOut.textContent = fmtRM(loan);
      totalOut.textContent = fmtRM(total);
    });
  </script>

</body>
</html>
